<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="crispEdges">
  <style>
    /* Animación de transmisión de datos cortada en píxeles */
    @keyframes transmit {
      0% { transform: translateX(0px); opacity: 0; }
      20% { transform: translateX(5px); opacity: 1; }
      40% { transform: translateX(10px); opacity: 1; }
      60% { transform: translateX(15px); opacity: 1; }
      80% { transform: translateX(20px); opacity: 1; }
      100% { transform: translateX(25px); opacity: 0; }
    }
    /* Animación de latido para las luces del servidor */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .anim-packet { animation: transmit 1.5s infinite steps(1); }
    .anim-blink { animation: blink 1s infinite steps(2); }
    
    .color-base { fill: #E0E0E0; } /* Blanco de tu texto */
    .color-bg { fill: #0D0D0D; }   /* Fondo oscuro */
    .color-accent { fill: #00FF41; } /* Verde terminal */
  </style>

  <!-- Fondo oscuro -->
  <rect width="100" height="100" class="color-bg"/>

  <!-- Servidor central (Inventario Nodo) -->
  <rect x="15" y="25" width="25" height="50" class="color-base"/>
  <rect x="18" y="30" width="19" height="8" class="color-bg"/>
  <rect x="18" y="45" width="19" height="8" class="color-bg"/>
  <rect x="18" y="60" width="19" height="8" class="color-bg"/>
  
  <!-- Luces de estado del servidor parpadeando -->
  <rect x="20" y="32" width="4" height="4" class="color-accent anim-blink"/>
  <rect x="20" y="47" width="4" height="4" class="color-accent anim-blink"/>
  <rect x="20" y="62" width="4" height="4" class="color-accent anim-blink"/>

  <!-- Terminal receptora (Espacio Comunitario) -->
  <!-- Monitor -->
  <rect x="65" y="35" width="24" height="20" class="color-base"/>
  <rect x="68" y="38" width="18" height="14" class="color-bg"/>
  <rect x="70" y="40" width="6" height="2" class="color-accent"/> <!-- Cursor en pantalla -->
  <!-- Pie y base de la PC -->
  <rect x="75" y="55" width="4" height="10" class="color-base"/>
  <rect x="69" y="65" width="16" height="5" class="color-base"/>
  
  <!-- Paquete de datos viajando -->
  <g class="anim-packet">
    <rect x="42" y="48" width="6" height="6" class="color-base"/>
  </g>
</svg>
